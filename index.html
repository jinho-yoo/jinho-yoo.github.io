<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안녕하세요! 저의 페이지입니다</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>안녕하세요! 👋</h1>
        <p>[jinho-yoo]의 페이지에 오신 것을 환영합니다.</p>
    </header>

    <main>
        <section id="about">
            <h2>소개</h2>
            <img src="https://via.placeholder.com/150" alt="프로필 사진 예시" class="profile-pic">
            <p>이곳은 GitHub Pages로 만든 저의 개인 웹사이트입니다. 자유롭게 내용을 채워보세요!</p>
            <p>예를 들어, 저는 [본인의 관심사나 직업]에 관심이 많습니다.</p>
        </section>

        <section id="links">
            <h2>유용한 링크</h2>
            <ul>
                <li><a href="https://github.com/[your-username]" target="_blank">나의 GitHub 프로필</a></li>
                <li><a href="#">나의 프로젝트 (링크 추가)</a></li>
                <li><a href="#">나의 블로그 (링크 추가)</a></li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 [본인 이름]. All rights reserved.</p>
    </footer>
</body>
</html>
